:root{--bg:#ffffff;--ui:#0b5f78;}
html,body{margin:0;height:100%;background:#fff;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:system-ui,sans-serif;}
canvas{max-width:100vw;max-height:calc(100vh - 60px);background:#fff;display:block;}
.ui{display:flex;gap:10px;align-items:center;color:var(--ui);font-size:14px;padding:0 16px;}
.ui button{border:1px solid #00B6E6;background:#fff;color:var(--ui);border-radius:6px;padding:6px 14px;cursor:pointer;font:inherit;}
.ui input{width:min(420px,50vw);accent-color:#00B6E6;}

const DISC = { x: 254.5, y: 176.5, r: 134 };    // inner blue globe
const RING = { x: 256, y: 178, r: 160.5, w: 7.4 };
const FEET_Y = 288.5;                            // hiker / ground split
const HIKER_AXIS = 244;                          // vertical rotation axis x
const ring = (() => {
  const a = Math.PI / 6, cx = RING.x, cy = RING.y, r = RING.r;
  const tl = [cx - r * Math.cos(a), cy + r * Math.sin(a)];
  const tr = [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const endY = 321, run = (endY - tl[1]) * Math.tan(a);
  const p = new Path2D();
  p.moveTo(tl[0] + run, endY);
  p.lineTo(tl[0], tl[1]);
  p.arc(cx, cy, r, Math.PI - a, a, false);       // clockwise over the top
  p.lineTo(tr[0] - run, endY);
  const seg = Math.hypot(run, endY - tl[1]);
  const len = 2 * seg + r * (2 * Math.PI - (Math.PI - 2 * a));
  return { path: p, len };
})();
const LINE_TOP = { x0: 91, x1: 420, y: 335.6, h: 6 };
const LINE_BOT = { x0: 91.5, x1: 420.5, y: 407.6, h: 6 };
const V_OUT = [[214.6, 427.6], [296.4, 427.6], [255.5, 496.5]];
const V_IN  = [[222.6, 427.6], [288.4, 427.6], [255.5, 483.0]];
const TRI   = [[238.8, 427.6], [272.2, 427.6], [255.5, 453.5]];
const TEXT = "МОЯ ПЛАНЕТА", TEXT_X0 = 92, TEXT_X1 = 420, TEXT_BASE = 391, CAP = 31.5;
const WEIGHT = +Q.get("wt") || 500;
const CENTER = { x: 255.5, y: 255 };

// ---------------- easing / helpers ----------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, t0, d) => clamp((t - t0) / d);
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInOutCubic = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eInOutSine = k => -(Math.cos(Math.PI * k) - 1) / 2;
const eOutBack = (k, s = 1.70158) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
// damped spring 0→1 (overshoots, settles exactly at 1 when k=1)
const spring = (k, freq = 2.2, damp = 5.5) =>
  k >= 1 ? 1 : 1 - Math.exp(-damp * k) * Math.cos(freq * Math.PI * 2 * k) * (1 - k * 0.0);
const bump = (t, t0, tin, hold, tout) => { // 0→1 hold →0, eased
  if (t < t0) return 0;
  if (t < t0 + tin) return eInOutSine((t - t0) / tin);
  if (t < t0 + tin + hold) return 1;
  return 1 - eInOutSine(clamp((t - t0 - tin - hold) / tout));
};
const poly = pts => { const p = new Path2D(); p.moveTo(...pts[0]); for (const q of pts.slice(1)) p.lineTo(...q); p.closePath(); return p; };
const PATH_V = (() => { const p = poly(V_OUT); p.addPath(poly(V_IN.slice().reverse())); return p; })();
const PATH_TRI = poly(TRI);

// ---------------- "fly out of the depth" ----------------
// Each element starts far behind the screen (tiny, scattered, rotated), rushes
// toward the viewer, slightly passes the picture plane (overshoot) and lands flat.
function flyState(t, t0, dur, dx, dy, rot) {
  const k = prog(t, t0, dur);
  if (k <= 0) return null;
  const s = spring(k, 1.15, 6.2);              // 0 → ~1.1 → 1
  const travel = 1 - eOutCubic(k);
  return {
    s: Math.max(0.001, s),
    dx: dx * travel, dy: dy * travel,
    rot: rot * travel * Math.PI / 180,
    a: clamp(k / 0.18),
  };
}
function withFly(c, st, ox, oy, draw) {
  if (!st) return;
  c.save();
  c.globalAlpha *= st.a;
  c.translate(ox + st.dx, oy + st.dy);
  c.rotate(st.rot);
  c.scale(st.s, st.s);
  c.translate(-ox, -oy);
  draw();
  c.restore();
}

// Small shards that zoom past the camera during the fly-in.
const SHARDS = Array.from({ length: 26 }, (_, i) => {
  const r = (n) => { const x = Math.sin(i * 127.1 + n * 311.7) * 43758.5453; return x - Math.floor(x); };
  return { ang: r(1) * Math.PI * 2, dist: 0.15 + r(2) * 0.9, t0: r(3) * 0.75, size: 3 + r(4) * 7,
           kind: r(5) < 0.5 ? 0 : 1, spin: (r(6) - 0.5) * 8, light: r(7) < 0.35 };
});
function drawShards(c, t, scale) {
  for (const sh of SHARDS) {
    const k = prog(t, sh.t0, 0.85);
    if (k <= 0 || k >= 1) continue;
    const z = Math.pow(k, 2.4);                    // accelerating toward viewer
    const persp = 0.05 + z * 6;
    const x = W / 2 + Math.cos(sh.ang) * sh.dist * persp * 260 * scale / 1.7;
    const y = H / 2 + Math.sin(sh.ang) * sh.dist * persp * 260 * scale / 1.7;
    c.save();
    c.globalAlpha = Math.sin(Math.PI * k) * 0.85;
    c.translate(x, y); c.rotate(sh.spin * k);
    const sz = sh.size * persp * scale * 0.6;
    c.fillStyle = sh.light ? "#8fe0f6" : BLUE;
    if (sh.kind === 0) { c.beginPath(); c.arc(0, 0, sz, 0, Math.PI * 2); c.fill(); }
    else { c.beginPath(); c.moveTo(-sz, -sz * .6); c.lineTo(sz, -sz * .6); c.lineTo(0, sz); c.closePath(); c.fill(); }
    c.restore();
  }
}

// ---------------- 3D globe ----------------
const LAND = [ // rough stylised land masses as lon/lat loops (degrees)
  [[-20,35],[5,38],[30,33],[45,15],[40,-5],[30,-25],[18,-35],[10,-20],[0,0],[-15,10],[-18,25]],
  [[60,55],[100,62],[140,60],[150,45],[120,30],[100,20],[80,25],[65,40]],
  [[-125,50],[-95,58],[-70,52],[-80,30],[-100,20],[-115,30]],
  [[-80,8],[-50,-5],[-38,-12],[-55,-30],[-70,-50],[-75,-20]],
  [[115,-15],[145,-12],[152,-28],[130,-35],[114,-28]],
];
function project(lon, lat, rot, tilt) {
  const L = (lon * Math.PI / 180) + rot, P = lat * Math.PI / 180;
  const x = Math.cos(P) * Math.sin(L), y = Math.sin(P), z = Math.cos(P) * Math.cos(L);
  const y2 = y * Math.cos(tilt) - z * Math.sin(tilt);
  const z2 = y * Math.sin(tilt) + z * Math.cos(tilt);
  return [x, y2, z2];
}
function drawGlobe(c, t, g) {
  if (g <= 0.001) return;
  const { x: cx, y: cy, r } = DISC;
  const rot = -2.6 * eInOutSine(prog(t, 1.75, 2.35)) - 0.4;
  const tilt = -0.32;
  c.save();
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.clip();
  // land masses
  c.fillStyle = `rgba(118,215,243,${0.55 * g})`;
  for (const loop of LAND) {
    const pts = []; let vis = 0;
    for (let i = 0; i < loop.length; i++) { // densify
      const a = loop[i], b = loop[(i + 1) % loop.length];
      for (let s = 0; s < 6; s++) {
        const lo = lerp(a[0], b[0], s / 6), la = lerp(a[1], b[1], s / 6);
        let [x, y, z] = project(lo, la, rot, tilt);
        if (z > 0) vis++; else { const m = Math.hypot(x, y) || 1; x /= m; y /= m; }
        pts.push([cx + x * r, cy - y * r]);
      }
    }
    if (!vis) continue;
    c.beginPath(); c.moveTo(...pts[0]);
    for (let i = 1; i <= pts.length; i++) {
      const p0 = pts[i - 1], p1 = pts[i % pts.length];
      c.quadraticCurveTo(p0[0], p0[1], (p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2);
    }
    c.fill();
  }
  // graticule
  c.lineWidth = 1.1; c.strokeStyle = `rgba(255,255,255,${0.38 * g})`;
  const seg = (fn) => {
    c.beginPath(); let pen = false;
    for (let i = 0; i <= 96; i++) {
      const [x, y, z] = fn(i / 96);
      if (z > 0.0) { const X = cx + x * r, Y = cy - y * r; pen ? c.lineTo(X, Y) : c.moveTo(X, Y); pen = true; }
      else pen = false;
    }
    c.stroke();
  };
  for (let lon = 0; lon < 180; lon += 30) {
    seg(k => project(lon, -90 + 180 * k, rot, tilt));
    seg(k => project(lon + 180, -90 + 180 * k, rot, tilt));
  }
  for (let lat = -60; lat <= 60; lat += 30) seg(k => project(-180 + 360 * k, lat, rot, tilt));
  // volume shading: soft key light upper-left + darker limb
  let gr = c.createRadialGradient(cx - r * .38, cy - r * .42, r * .05, cx - r * .2, cy - r * .2, r * 1.15);
  gr.addColorStop(0, `rgba(255,255,255,${0.42 * g})`);
  gr.addColorStop(0.45, `rgba(255,255,255,${0.06 * g})`);
  gr.addColorStop(1, `rgba(255,255,255,0)`);
  c.fillStyle = gr; c.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  gr = c.createRadialGradient(cx - r * .15, cy - r * .2, r * .55, cx, cy, r * 1.02);
  gr.addColorStop(0, "rgba(0,70,110,0)");
  gr.addColorStop(1, `rgba(0,70,110,${0.42 * g})`);
  c.fillStyle = gr; c.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  c.restore();
}

// ---------------- hiker: flat → extruded 3D turn → flat ----------------
function drawHiker(c, t) {
  const k3 = bump(t, 2.55, 0.55, 0.7, 0.6);       // depth amount
  const turn = bump(t, 2.65, 0.6, 0.55, 0.65);    // rotation amount
  const theta = -0.62 * turn;                     // ≈ 35° toward the viewer
  const depth = 18 * k3;
  const lift = 1 + 0.05 * turn;
  const clipHiker = () => { c.beginPath(); c.rect(0, -50, 512, FEET_Y + 50); c.clip(); };
  const at = (z, fill) => {
    c.save();
    c.translate(HIKER_AXIS, FEET_Y);
    c.scale(lift, lift);
    // y-axis rotation (orthographic) + slight perspective skew of the depth
    c.transform(Math.cos(theta), 0, 0, 1, z * Math.sin(-theta) * 1.0 - z * 0.18, -z * 0.28);
    c.translate(-HIKER_AXIS, -FEET_Y);
    clipHiker();
    c.fillStyle = fill; c.fill(WHITE);
    c.restore();
  };
  if (depth > 0.05) {
    // soft contact shadow on the globe
    c.save(); c.globalAlpha = 0.22 * k3; c.fillStyle = "#00445f";
    c.beginPath(); c.ellipse(HIKER_AXIS + 6, FEET_Y - 1, 36 * k3 + 8, 4, 0, 0, Math.PI * 2); c.fill(); c.restore();
    const n = Math.ceil(depth / 0.5);
    for (let i = n; i >= 1; i--) {
      const z = depth * i / n;
      const sh = Math.round(lerp(225, 170, i / n));
      at(z, `rgb(${sh - 18},${sh + 6},${Math.min(255, sh + 16)})`);
    }
  }
  // front face, faint lighting gradient while in 3D
  at(0, "#ffffff");
  if (k3 > 0.01) {
    c.save();
    c.translate(HIKER_AXIS, FEET_Y); c.scale(lift, lift); c.transform(Math.cos(theta), 0, 0, 1, 0, 0); c.translate(-HIKER_AXIS, -FEET_Y);
    clipHiker(); c.clip(WHITE);
    const gr = c.createLinearGradient(190, 60, 300, 290);
    gr.addColorStop(0, "rgba(255,255,255,0)");
    gr.addColorStop(1, `rgba(150,205,225,${0.35 * k3})`);
    c.fillStyle = gr; c.fillRect(150, 40, 200, 260);
    c.restore();
  }
}
function drawGround(c) {
  c.save(); c.beginPath(); c.rect(0, FEET_Y - 3, 512, 100); c.clip();
  c.fillStyle = "#fff"; c.fill(WHITE);
  c.beginPath(); c.arc(DISC.x, DISC.y, DISC.r + 0.6, 0, Math.PI * 2); c.clip(); c.beginPath(); c.rect(0, 296, 512, 100); c.clip();
  c.strokeStyle = "#fff"; c.lineWidth = 1.6; c.stroke(WHITE); c.restore();
}

// ---------------- kinetic typography ----------------
let GLYPHS = null;
function layoutText(c) {
  const size = CAP / 0.711;
  c.font = `${WEIGHT} ${size}px "MP Cond", "Roboto Condensed", "Arial Narrow", sans-serif`;
  const chars = [...TEXT];
  const adv = chars.map(ch => c.measureText(ch).width);
  const firstL = c.measureText(chars[0]).actualBoundingBoxLeft;
  const lastR = c.measureText(chars.at(-1)).actualBoundingBoxRight;
  const natural = adv.slice(0, -1).reduce((a, b) => a + b, 0) + lastR + firstL;
  const extra = (TEXT_X1 - TEXT_X0 - natural) / (chars.length - 1);
  let x = TEXT_X0 + firstL;
  GLYPHS = chars.map((ch, i) => { const g = { ch, x: x + adv[i] / 2, size }; x += adv[i] + extra; return g; });
}
function drawText(c, t) {
  if (!GLYPHS) layoutText(c);
  c.save();
  c.font = `${WEIGHT} ${GLYPHS[0].size}px "MP Cond", "Roboto Condensed", "Arial Narrow", sans-serif`;
  c.textAlign = "center"; c.textBaseline = "alphabetic"; c.fillStyle = BLUE;
  let n = 0;
  GLYPHS.forEach((g, i) => {
    if (g.ch === " ") return;
    const k = prog(t, 4.05 + n * 0.085, 0.62); n++;
    if (k <= 0) return;
    const dir = n % 2 ? 1 : -1;
    const s = lerp(2.4, 1, eOutBack(k, 2.2)) * (k < 1 ? 1 : 1);
    const rot = dir * (1 - eOutCubic(k)) * 1.25 + dir * Math.sin(k * Math.PI) * 0.18 * (1 - k);
    const yOff = -(1 - eOutCubic(k)) * 22;
    c.save();
    c.globalAlpha = clamp(k / 0.25);
    c.translate(g.x, TEXT_BASE - CAP / 2 + yOff);
    c.rotate(rot); c.scale(s, s);
    c.fillText(g.ch, 0, CAP / 2);
    c.restore();
  });
  c.restore();
}

// ---------------- full frame ----------------
function drawLogo(c, t, S, OX, OY) {
  c.save();
  c.translate(OX, OY); c.scale(S, S);

  // 1. globe disc + white hiker/ground fly in
  withFly(c, flyState(t, 0.00, 1.05, 0, 40, -18), DISC.x, DISC.y, () => {
    c.fillStyle = BLUE; c.beginPath(); c.arc(DISC.x, DISC.y, DISC.r, 0, Math.PI * 2); c.fill();
    drawGlobe(c, t, bump(t, 1.75, 0.45, 1.35, 0.55));
  });
  withFly(c, flyState(t, 0.16, 1.0, 70, -110, 22), 244, 180, () => {
    drawGround(c); drawHiker(c, t);
  });

  // 2. outer pin outline draws itself around the circle
  const kr = eInOutCubic(prog(t, 0.65, 1.15));
  if (kr > 0) {
    c.save();
    c.strokeStyle = BLUE; c.lineWidth = RING.w; c.lineCap = "butt"; c.lineJoin = "miter";
    c.setLineDash([ring.len * kr, ring.len + 10]);
    c.stroke(ring.path);
    c.restore();
  }

  // 3. lines + tip fly in
  withFly(c, flyState(t, 0.32, 0.95, -260, -60, -14), 255, LINE_TOP.y, () => {
    c.fillStyle = BLUE; c.fillRect(LINE_TOP.x0, LINE_TOP.y, LINE_TOP.x1 - LINE_TOP.x0, LINE_TOP.h);
  });
  withFly(c, flyState(t, 0.42, 0.95, 280, 70, 12), 255, LINE_BOT.y, () => {
    c.fillStyle = BLUE; c.fillRect(LINE_BOT.x0, LINE_BOT.y, LINE_BOT.x1 - LINE_BOT.x0, LINE_BOT.h);
  });
  withFly(c, flyState(t, 0.50, 0.95, -40, 190, 70), 255.5, 455, () => {
    c.fillStyle = BLUE; c.fill(PATH_V, "evenodd");
  });
  withFly(c, flyState(t, 0.58, 0.95, 90, 230, -120), 255.5, 437, () => {
    c.fillStyle = BLUE; c.fill(PATH_TRI);
  });

  // 4. kinetic typography
  drawText(c, t);
  c.restore();
}

function renderSingle(c, t) {
  const S = H * 0.80 / 482;
  const OX = W / 2 - CENTER.x * S, OY = H / 2 - CENTER.y * S;
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.clearRect(0, 0, W, H);
  drawLogo(lctx, t, S, OX, OY);

  // 5. glossy light sweep, clipped to the assembled logo
  const ks = prog(t, 6.0, 1.05);
  if (ks > 0 && ks < 1) {
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.clearRect(0, 0, W, H);
    sctx.drawImage(layer, 0, 0);
    sctx.globalCompositeOperation = "source-atop";
    const x = lerp(OX + 0 * S, OX + 560 * S, eInOutSine(ks));
    sctx.save();
    sctx.translate(x, H / 2); sctx.rotate(0.38);
    const bw = 150 * S;
    const gr = sctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
    gr.addColorStop(0, "rgba(255,255,255,0)");
    gr.addColorStop(0.42, "rgba(255,255,255,0.55)");
    gr.addColorStop(0.5, "rgba(255,255,255,0.95)");
    gr.addColorStop(0.58, "rgba(255,255,255,0.55)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    sctx.fillStyle = gr; sctx.fillRect(-bw / 2, -H, bw, H * 2);
    // thin secondary streak
    const g2 = sctx.createLinearGradient(bw * 0.55, 0, bw * 0.75, 0);
    g2.addColorStop(0, "rgba(255,255,255,0)"); g2.addColorStop(.5, "rgba(255,255,255,.7)"); g2.addColorStop(1, "rgba(255,255,255,0)");
    sctx.fillStyle = g2; sctx.fillRect(bw * 0.55, -H, bw * 0.2, H * 2);
    sctx.restore();
    sctx.globalCompositeOperation = "source-over";
  }

  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = "#fff"; c.fillRect(0, 0, W, H);
  drawShards(c, t, S);
  c.drawImage(ks > 0 && ks < 1 ? sheenC : layer, 0, 0);
}

// Frame render with optional motion blur (temporal super-sampling, 180° shutter).
window.renderFrame = (t, samples = 1) => {
  if (samples <= 1) { renderSingle(ctx, t); return; }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let i = 0; i < samples; i++) {
    const ts = t + (i / samples - 0.5) * (0.5 / FPS);
    renderSingle(tctx, Math.max(0, ts));
    ctx.globalAlpha = 1 / (i + 1);
    ctx.drawImage(tmp, 0, 0);
  }
  ctx.globalAlpha = 1;
};
window.DURATION = DURATION; window.FPS = FPS;

// ---------------- live preview ----------------
window.ready = document.fonts.load(`500 40px "MP Cond"`).then(() => { GLYPHS = null; });
if (!CAPTURE) {
  const play = document.getElementById("play"), scrub = document.getElementById("scrub"), tc = document.getElementById("tc");
  scrub.max = DURATION;
  let playing = true, t0 = performance.now(), cur = 0;
  play.onclick = () => { playing = !playing; play.textContent = playing ? "Пауза" : "Играть"; t0 = performance.now() - cur * 1000; };
  scrub.oninput = () => { cur = +scrub.value; t0 = performance.now() - cur * 1000; if (playing) play.click(); };
  window.ready.then(() => {
    const loop = (now) => {
      if (playing) { cur = ((now - t0) / 1000) % (DURATION + 1); }
      const t = Math.min(cur, DURATION);
      window.renderFrame(t, 1);
      scrub.value = t; tc.textContent = t.toFixed(2) + " s";
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}
</script>
